<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Component Library Showcase</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #fafafa; height: 100vh; display: flex; flex-direction: column; }

    nav {
      display: flex; align-items: center; gap: 0; border-bottom: 1px solid #262626;
      background: #0a0a0a; flex-shrink: 0; height: 48px;
    }
    nav .title {
      padding: 0 20px; font-weight: 600; font-size: 14px; color: #a1a1aa;
      border-right: 1px solid #262626; height: 100%; display: flex; align-items: center;
      white-space: nowrap;
    }
    nav button {
      background: none; border: none; color: #a1a1aa; cursor: pointer;
      padding: 0 20px; font-size: 13px; font-family: inherit;
      border-right: 1px solid #262626; height: 100%;
      transition: background 0.15s, color 0.15s;
    }
    nav button:hover { background: #1a1a1a; color: #fafafa; }
    nav button.active { background: #18181b; color: #fafafa; border-bottom: 2px solid #3b82f6; }

    .status { margin-left: auto; padding: 0 20px; font-size: 12px; color: #52525b; }
    .status .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; }
    .status .dot.ok { background: #22c55e; }
    .status .dot.err { background: #ef4444; }

    main { flex: 1; position: relative; }
    iframe { width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; }
    iframe.hidden { display: none; }

    .loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #52525b; font-size: 14px;
    }
  </style>
</head>
<body>
  <nav>
    <div class="title">Showcases</div>
    <button class="active" data-port="3001">shadcn/ui</button>
    <button data-port="3002">Mantine</button>
    <button data-port="3003">DaisyUI</button>
    <button data-port="3004">HeroUI</button>
    <button data-port="3005">Tremor</button>
    <button data-port="3006">Animations</button>
    <div class="status" id="status"></div>
  </nav>
  <main id="main">
    <div class="loading">Loading...</div>
  </main>

  <script>
    const ports = { 3001: 'shadcn/ui', 3002: 'Mantine', 3003: 'DaisyUI', 3004: 'HeroUI', 3005: 'Tremor', 3006: 'Animations' };
    const main = document.getElementById('main');
    const buttons = document.querySelectorAll('nav button');
    const iframes = {};
    let activePort = '3001';

    // Create iframes lazily
    function showPort(port) {
      activePort = port;
      buttons.forEach(b => b.classList.toggle('active', b.dataset.port === port));

      // Hide all iframes
      Object.values(iframes).forEach(f => f.classList.add('hidden'));

      // Create iframe if not exists
      if (!iframes[port]) {
        const iframe = document.createElement('iframe');
        iframe.src = `http://localhost:${port}`;
        iframe.onload = () => {
          const loading = main.querySelector('.loading');
          if (loading) loading.remove();
        };
        main.appendChild(iframe);
        iframes[port] = iframe;
      }

      iframes[port].classList.remove('hidden');
    }

    buttons.forEach(btn => {
      btn.addEventListener('click', () => showPort(btn.dataset.port));
    });

    // Check server status
    async function checkStatus() {
      const statusEl = document.getElementById('status');
      const results = await Promise.all(
        Object.keys(ports).map(async port => {
          try {
            await fetch(`http://localhost:${port}`, { mode: 'no-cors', signal: AbortSignal.timeout(2000) });
            return { port, ok: true };
          } catch {
            return { port, ok: false };
          }
        })
      );
      const running = results.filter(r => r.ok).length;
      statusEl.innerHTML = `<span class="dot ${running === 6 ? 'ok' : 'err'}"></span>${running}/6 servers`;
    }

    showPort('3001');
    checkStatus();
    setInterval(checkStatus, 10000);
  </script>
</body>
</html>
